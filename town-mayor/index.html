<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 시장님</title>
<script type="application/json" id="block-record">
{"kit": "v0.9", "ai": "Claude Code (Claude Opus 5.5) + Magnific 그림", "tries": 12, "asked": "블럭은 별로야, 네가 혼자 도시 문제 게임을 만들어서 올리자", "notes": "블록제작으로 만든 그림 찾기 퀴즈가 재미없어서 미니어처 도시 키우기 게임으로 새로 만듦. 시민 목소리로 문제를 알아채고 알맞은 시설을 지으면 문제가 줄어드는 원인과 결과를 봄. 처음에 따라 하기 8단계를 넣고, 도로 방향·교차로·매연 저감 시설·정류장·주차장 그림을 고침."}
</script>
<style>
  :root {
    --bg: #eaf3f8; --paper: #ffffff; --line: #d5dde3; --ink: #1f2a33; --sub: #5b6873;
    --accent: #1f6f5c; --warn: #c2512a; --gold: #f2b632;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 14px;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 8px; }
  .top { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .top h1 { font-size: 17px; margin: 0; align-self: center; padding: 0 4px; }
  .box { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 112px; }
  .box small { font-size: 13px; color: var(--sub); font-weight: 700; white-space: nowrap; }
  .box .v { font-size: 22px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
  .box .v.neg { color: var(--warn); }
  .box .v em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--sub); }
  .box .bar { position: relative; height: 8px; border-radius: 3px; background: #edf0f2; overflow: hidden; }
  .box .bar i { display: block; height: 100%; width: 0; background: #e0a530; transition: width .4s, background-color .4s; }
  .box.ok { border-color: var(--accent); border-width: 2px; padding: 3px 9px; }
  .box.ok .bar i { background: var(--accent); }
  .box .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .goalrow { width: 100%; display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding: 5px 4px 0; font-size: 15px; font-weight: 800; }
  .goalrow span { font-weight: 700; color: var(--accent); }
  .ctrl { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; white-space: nowrap; }
  .btn.on { border: 2px solid var(--ink); padding: 5px 11px; }
  .btn.send { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn:disabled { opacity: .6; }
  .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 6px; }
  .board { position: relative; min-height: 0; min-width: 0; background: #cfe6f2; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(31, 42, 51, .88); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .side { min-height: 0; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .side-in { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 10px 12px; }
  .side-in::-webkit-scrollbar { display: none; }
  .h2 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .voice { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .voice img { width: 40px; height: auto; }
  .voice p { margin: 0; font-size: 14px; line-height: 1.35; }
  .voice small { display: block; margin-top: 3px; font-size: 12px; color: var(--sub); }
  .voice .tag { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--warn); font-weight: 700; }
  .meter { margin: 6px 0 0; height: 6px; background: #f1eeea; border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--warn); }
  .info { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--sub); line-height: 1.5; }
  .info b { color: var(--ink); font-size: 14px; }
  .tools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .tools::-webkit-scrollbar { display: none; }
  .tool { flex: none; width: 86px; padding: 4px 2px 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .tool img { width: 46px; height: 38px; object-fit: contain; }
  .tool span { font-size: 12px; line-height: 1.2; white-space: nowrap; }
  .tool em { font-style: normal; font-size: 12px; color: var(--sub); }
  .tool.on { border: 2px solid var(--ink); padding: 3px 1px 4px; background: #f5f8fa; }
  .tool.poor em { color: var(--warn); }
  .tool.lock { opacity: .4; }
  .tut { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(560px, calc(100% - 20px));
    background: #fff; border: 2px solid var(--gold); border-radius: 10px; padding: 10px 14px; display: none; gap: 10px; align-items: center; z-index: 2; }
  .tut.show { display: flex; }
  .tut img { width: 46px; flex: none; }
  .tut div { flex: 1; }
  .tut small { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
  .tut p { margin: 2px 0 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
  .tut .btn { flex: none; font-size: 12px; padding: 4px 8px; }
  .tool.pulse { border: 3px solid var(--gold); padding: 2px 0 3px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: translateY(-4px); } }
  .cover { position: fixed; inset: 0; background: rgba(20, 30, 38, .55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .cover.show { display: flex; }
  .card { width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; scrollbar-width: none; background: #fff; border-radius: 10px; padding: 18px 20px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  .intro { width: min(640px, 100%); padding: 0; overflow: hidden auto; }
  .hero { position: relative; height: 145px; background: #dcefe6; border-bottom: 1px solid var(--line); overflow: hidden; }
  .hero .sky { position: absolute; inset: 0 0 46% 0; background: #d6ebf6; }
  .hero img { position: absolute; bottom: 8px; height: auto; }
  .intro .in { padding: 16px 22px 18px; }
  .intro h2 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
  .intro .sub { margin: 4px 0 14px; color: var(--sub); font-size: 15px; }
  .goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .goals div { border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .goals small { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
  .goals b { font-size: 24px; font-weight: 800; }
  .goals b em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--sub); }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .how div { background: #f3f7f9; border-radius: 8px; padding: 8px 6px 10px; text-align: center; }
  .how img { height: 52px; width: auto; max-width: 70px; object-fit: contain; display: block; margin: 0 auto 4px; }
  .how span { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
  .how b { display: block; font-size: 14px; line-height: 1.35; }
  .intro .row { margin-top: 16px; }
  .intro .primary { font-size: 17px; padding: 11px 34px; }
  @media (max-width: 520px) {
    .hero { height: 96px; }
    .intro .in { padding: 12px 14px 14px; }
    .intro h2 { font-size: 23px; }
    .intro .sub { font-size: 14px; margin-bottom: 10px; }
    .goals b { font-size: 19px; }
    .how img { height: 40px; }
    .how b { font-size: 13px; }
    .intro .primary { width: 100%; }
  }

  .card p { margin: 6px 0; line-height: 1.5; }
  .card .goal { display: flex; gap: 10px; align-items: center; margin: 12px 0; padding: 10px; background: #f3f7f9; border-radius: 8px; }
  .card .goal img { width: 64px; }
  .card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .primary { padding: 9px 22px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 700; }
  .card table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .card th, .card td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .card th { color: var(--sub); font-weight: 400; }
  .chart { width: 100%; height: 130px; margin-top: 8px; }
  .card.wide { width: min(820px, 100%); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .tile small { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
  .tile b { font-size: 21px; font-weight: 800; }
  .tile b em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--sub); }
  .tile .res { display: block; font-size: 12px; font-weight: 700; color: var(--warn); }
  .tile.ok { border: 2px solid var(--accent); padding: 6px 9px; }
  .tile.ok .res { color: var(--accent); }
  .sec { margin: 12px 0 4px; font-size: 13px; font-weight: 800; }
  .built { font-size: 14px; line-height: 1.6; }
  .pb { display: grid; grid-template-columns: 92px 1fr 46px; gap: 6px; align-items: center; font-size: 13px; margin: 4px 0; }
  .pb .t { height: 12px; background: #edf0f2; border-radius: 3px; overflow: hidden; }
  .pb .t i { display: block; height: 100%; background: var(--warn); }
  .pb small { grid-column: 2 / 4; font-size: 12px; color: var(--sub); margin-top: -3px; }
  .endgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .rec { border: 2px solid var(--ink); border-radius: 8px; padding: 10px 12px; }
  .rec small { display: block; font-size: 13px; color: var(--sub); font-weight: 700; }
  .rec .big { font-size: 22px; font-weight: 800; line-height: 1.3; margin: 2px 0 8px; }
  .rec .big:last-child { margin-bottom: 0; }
  .rec .big em { font-style: normal; font-size: 15px; font-weight: 600; color: var(--sub); }
  .talk { margin: 12px 0 0; padding-left: 22px; }
  .talk li { margin: 6px 0; line-height: 1.45; font-size: 15px; }
  .talk b { display: block; font-size: 12px; color: var(--sub); }
  @media (max-width: 700px) { .endgrid { grid-template-columns: 1fr; } .rec .big { font-size: 19px; } }
  /* 세로로 세운 태블릿: 게임판 위, 목소리 칸 아래 */
  /* 낮은 화면(블록 칸 안 등): 위쪽·아래쪽을 줄여 게임판을 크게 */
  @media (min-width: 761px) and (max-height: 700px) {
    .app { padding: 4px; gap: 4px; }
    .top { padding: 3px 6px; gap: 6px; }
    .top h1 { font-size: 15px; }
    .box { padding: 2px 8px; min-width: 96px; gap: 1px; }
    .box.ok { padding: 1px 7px; }
    .box .v { font-size: 17px; }
    .box .bar { height: 6px; }
    .goalrow { padding-top: 2px; font-size: 13px; }
    .ctrl .btn { padding: 4px 9px; }
    .main { grid-template-columns: minmax(0, 1fr) 230px; gap: 4px; }
    .tools { padding: 4px; gap: 4px; }
    .tool { width: 74px; padding: 2px 1px 3px; }
    .tool.on { padding: 1px 0 2px; }
    .tool img { width: 38px; height: 28px; }
    .side-in { padding: 8px 10px; }
  }
  @media (min-width: 761px) and (max-height: 520px) {
    .goalrow { display: none; }
    .box small { font-size: 12px; }
    .tool em { display: none; }
  }
  @media (min-width: 761px) and (max-width: 1000px) {
    .main { grid-template-columns: minmax(0, 1fr) 220px; }
  }
  @media (min-width: 761px) and (orientation: portrait) {
    .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(220px, 34%); }
  }
  @media (max-width: 760px) {
    .app { padding: 5px; gap: 5px; }
    .top { gap: 5px; padding: 5px; }
    .top h1 { display: none; }
    .box { min-width: 72px; flex: 1 1 0; padding: 2px 5px; gap: 1px; }
    .box.ok { padding: 1px 4px; }
    .box small { font-size: 12px; }
    .box .v { font-size: 16px; }
    .box .v em { font-size: 12px; font-weight: 400; }
    .box .bar { height: 6px; }
    .goalrow { order: 5; width: auto; flex: 1 1 220px; border-top: 0; padding: 0 2px; font-size: 13px; display: block; align-self: center; }
    .ctrl { order: 6; }
    .ctrl .btn { padding: 4px 8px; }
    .ctrl { margin-left: 0; }
    .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(150px, 38%); }
    .tool { width: 80px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>우리 동네 시장님</h1>
    <div class="box"><small>예산</small><span class="v" id="money">0</span></div>
    <div class="box" id="popBox"><small>인구</small><span class="v"><span id="pop">0</span> <em>/ 500명</em></span><span class="bar"><i id="popBar"></i></span></div>
    <div class="box" id="hapBox"><small>만족도</small><span class="v"><span id="hnum">0</span> <em>/ 70</em></span><span class="bar"><i id="hbar"></i><span class="mark" style="left:70%"></span></span></div>
    <div class="box"><small>남은 기간</small><span class="v"><span id="left">36</span><em>달</em></span><span class="bar"><i id="timeBar" style="background:#8a98a3"></i></span></div>
    <span class="ctrl">
      <button class="btn" id="pause">멈춤</button>
      <button class="btn" id="fast">빠르게</button>
      <button class="btn" id="fullBtn" hidden>크게 보기</button>
    </span>
    <div class="goalrow">목표 <span>36달 안에 인구 500명, 만족도 70 넘기기</span></div>
  </header>
  <main class="main">
    <section class="board" id="board"><canvas id="cv"></canvas><div class="toast" id="toast"></div>
      <div class="tut" id="tut"><img id="tutImg" alt=""><div><small id="tutStep"></small><p id="tutText"></p></div><button class="btn" id="tutSkip">건너뛰기</button></div></section>
    <aside class="side"><div class="side-in" id="side"></div></aside>
  </main>
  <nav class="tools" id="tools"></nav>
</div>

<div class="cover show" id="intro">
  <div class="card intro">
    <div class="hero"><div class="sky"></div><img data-sp="park" alt="" style="left:2%;width:14.4%"><img data-sp="apt" alt="" style="left:15%;width:14.4%"><img data-sp="house" alt="" style="left:30%;width:15.0%"><img data-sp="shop" alt="" style="left:46%;width:15.0%"><img data-sp="bus" alt="" style="left:61%;width:15.0%"><img data-sp="factory" alt="" style="left:76%;width:15.6%"><img data-sp="happy" alt="" style="left:9%;width:8.1%;bottom:28%"><img data-sp="angry" alt="" style="left:88%;width:8.1%;bottom:28%"></div>
    <div class="in">
      <h2>우리 동네 시장님</h2>
      <p class="sub">빈 땅에 집과 가게, 공장을 지어 사람들이 살고 싶은 동네를 만들어요.</p>
      <div class="goals"><div><small>기간</small><b>36 <em>달 안에</em></b></div><div><small>인구</small><b>500 <em>명</em></b></div><div><small>만족도</small><b>70 <em>넘기기</em></b></div></div>
      <div class="how"><div><img data-sp="angry" alt=""><span>1</span><b>시민 목소리 듣기</b></div><div><img data-sp="recycle" alt=""><span>2</span><b>알맞은 시설 짓기</b></div><div><img data-sp="happy" alt=""><span>3</span><b>살기 좋은 동네</b></div></div>
      <div class="row"><button class="primary" id="startBtn">시작하기</button></div>
    </div>
  </div>
</div>
<div class="cover" id="endCover"><div class="card" id="endCard"></div></div>

    park:     { name: "공원", cost: 150, sprite: "park", upkeep: 5, info: "놀 곳이 생기고 공기가 맑아지고 만족도가 올라요." },
    school:   { name: "학교", cost: 260, sprite: "school", jobs: 10, upkeep: 15, info: "아이들이 공부할 곳. 일자리 10개." },
    filter:   { name: "매연 저감 시설", cost: 200, sprite: "filter", upkeep: 12, info: "공장 매연을 걸러 내요. 공장 하나만큼 공기가 맑아져요." },
    hospital: { name: "병원", cost: 300, sprite: "hospital", jobs: 15, upkeep: 20, info: "아플 때 갈 곳. 일자리 15개." },
    bulldoze: { name: "허물기", cost: 0, sprite: "grass", info: "지은 것을 허물고 비용의 절반을 돌려받아요." }
  };
  var ORDER = ["house", "apt", "shop", "factory", "road", "bus", "parking", "recycle", "park", "filter", "school", "hospital", "bulldoze"];

  // 문제: 이름, 시민 말, 도움 되는 시설
  var P = {
    traffic: { name: "교통 혼잡", say: "출근길에 차가 꽉 막혀요!", fix: "버스 정류장, 도로", who: "angry" },
    parking: { name: "주차 공간 부족", say: "차를 세울 곳이 없어요!", fix: "공영 주차장", who: "angry" },
    trash:   { name: "쓰레기 문제", say: "골목에 쓰레기가 쌓였어요!", fix: "재활용 센터", who: "angry" },
    air:     { name: "대기 오염", say: "공기가 답답해서 숨쉬기 힘들어요!", fix: "공원, 버스 정류장, 매연 저감 시설", who: "angry" },
    housing: { name: "주택 부족", say: "이사 오고 싶은데 살 집이 없어요!", fix: "집, 아파트", who: "angry" },
    jobs:    { name: "일자리 부족", say: "일자리가 있으면 이사 올 사람이 많아요!", fix: "상가, 공장", who: "angry" },
    play:    { name: "놀이 공간 부족", say: "아이들이 놀 곳이 없어요!", fix: "공원", who: "angry" },
    school:  { name: "학교 부족", say: "아이들이 다닐 학교가 멀어요!", fix: "학교", who: "angry" },
    hospital:{ name: "병원 부족", say: "아플 때 갈 병원이 없어요!", fix: "병원", who: "angry" }
  };

  var N = 9, MONTHS = 36, MONTH_SEC = 5;
  var S;

  function fresh() {
    var grid = [];
    for (var i = 0; i < N; i++) { grid.push([]); for (var j = 0; j < N; j++) grid[i].push(null); }
    // 처음부터 있는 것: 가운데 도로 한 줄과 집 두 채
    for (var k = 0; k < N; k++) grid[4][k] = "road";
    grid[3][3] = "house"; grid[3][5] = "house";
    return { grid: grid, money: 900, pop: 30, happy: 60, month: 1, t: 0, paused: false, fast: false, sel: "house",
      sev: {}, seen: {}, firstAt: {}, fixedBy: {}, hist: [{ pop: 30, happy: 60 }], over: false, started: false, built: 0, tut: -1 };
  }

  function count(type) {
    var n = 0;
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if (S.grid[i][j] === type) n++;
    return n;
  }
  function totals() {
    var t = { homes: 0, jobs: 0, tax: 0, upkeep: 0 };
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
      var b = B[S.grid[i][j]];
      if (!b) continue;
      t.homes += b.homes || 0; t.jobs += b.jobs || 0; t.tax += b.tax || 0; t.upkeep += b.upkeep || 0;
    }
    return t;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // 지금 도시의 문제 크기(0~100)
  function problems() {
    var t = totals(), pop = S.pop;
    var cars = pop * 0.45 + t.jobs * 0.25;
    var road = count("road"), bus = count("bus"), park = count("park");
    var sev = {};
    var cap = 30 + road * 6 + bus * 70;
    sev.traffic = clamp((cars - cap) / cap * 120, 0, 100);
    var spots = 25 + count("parking") * 70 + count("house") * 4;
    sev.parking = clamp((cars * 0.7 - spots) / spots * 110, 0, 100);
    var trash = pop + count("shop") * 25;
    var tcap = 90 + count("recycle") * 230;
    sev.trash = clamp((trash - tcap) / tcap * 120, 0, 100);
    var smoke = count("factory") * 45 + cars * 0.25 - park * 30 - bus * 20 - count("filter") * 45;
    sev.air = clamp((smoke - 40) * 1.4, 0, 100);
    var want = t.jobs * 1.3 + 20;
    sev.housing = clamp((want - t.homes) / Math.max(20, t.homes) * 90, 0, 100);
    sev.jobs = clamp((pop - (t.jobs * 1.3 + 20)) / Math.max(20, pop) * 140, 0, 100);
    // 인구가 더 늘지 못하고 멈췄을 때: 막고 있는 쪽(집 또는 일자리)을 알려 준다
    var homeCap = t.homes, jobCap = t.jobs * 1.3 + 30;
    if (pop >= Math.min(homeCap, jobCap) - 10) {
      if (homeCap <= jobCap) sev.housing = Math.max(sev.housing, 45); else sev.jobs = Math.max(sev.jobs, 45);
    }
    sev.play = clamp((pop / 140 - park) * 40, 0, 100);
    sev.school = pop > 180 && !count("school") ? clamp((pop - 180) / 2, 20, 90) : 0;
    sev.hospital = pop > 280 && !count("hospital") ? clamp((pop - 280) / 2, 20, 90) : 0;
    return sev;
  }

  function monthTick() {
    var t = totals();
    var sev = problems();
    // 만족도: 문제 크기만큼 줄고 공원이 있으면 조금 오름
    var penalty = 0;
    Object.keys(sev).forEach(function (k) { penalty += sev[k] * (k === "jobs" || k === "housing" ? 0.18 : 0.22); });
    var target = clamp(82 - penalty + count("park") * 2, 0, 100);
    S.happy = Math.round(S.happy + (target - S.happy) * 0.45);
    // 인구: 집과 일자리, 만족도에 따라
    var room = Math.min(t.homes, t.jobs * 1.3 + 30);
    var grow = (room - S.pop) * 0.5;
    if (S.happy < 40) grow = Math.min(grow, -(40 - S.happy) * 0.8);
    S.pop = Math.max(0, Math.round(S.pop + clamp(grow, -40, 90)));
    // 돈
    S.money += Math.round(S.pop * 0.9 + t.tax - t.upkeep);
    // 기록
    Object.keys(sev).forEach(function (k) {
      if (sev[k] >= 35) { S.seen[k] = (S.seen[k] || 0) + 1; if (!S.firstAt[k]) S.firstAt[k] = S.month; }
    });
    S.sev = sev;
    S.month++;
    S.hist.push({ pop: S.pop, happy: S.happy });
    if (S.month > MONTHS) end();
  }

  // ---------- 그리기 ----------
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var geo = { tw: 100, th: 59, ox: 0, oy: 0, dpr: 1 };
  var hover = null, anim = 0;

  function resize() {
    var r = cv.getBoundingClientRect();
    geo.dpr = Math.min(1.5, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * geo.dpr); cv.height = Math.round(r.height * geo.dpr);
    var tw = Math.min(r.width / (N + 0.25), (r.height - 16) / (N * 0.59 + 0.95));
    geo.tw = tw; geo.th = tw * 0.59;
    geo.ox = r.width / 2;
    var used = N * geo.th + tw * 0.95;
    geo.oy = (r.height - used) / 2 + tw * 0.9;
    geo.w = r.width; geo.h = r.height;
  }
  function cellTop(i, j) { return { x: geo.ox + (i - j) * geo.tw / 2, y: geo.oy + (i + j) * geo.th / 2 }; }
  function drawSprite(name, i, j, scale, lift) {
    var im = IMG[name], sp = SP[name];
    if (!im || !im.complete) return;
    var c = cellTop(i, j);
    var w = geo.tw * (scale || 1), h = sp.h * w / sp.w;
    var bottom = c.y + geo.th + geo.tw * 0.046 - (lift || 0);
    ctx.drawImage(im, c.x - w / 2, bottom - h, w, h);
  }
  // 도로는 이웃한 도로를 보고 방향을 정한다(양쪽 다 있으면 교차로)
  function isRoad(i, j) { return i >= 0 && j >= 0 && i < N && j < N && S.grid[i][j] === "road"; }
  function roadSprite(i, j) {
    var alongI = isRoad(i - 1, j) || isRoad(i + 1, j), alongJ = isRoad(i, j - 1) || isRoad(i, j + 1);
    if (alongI && alongJ) return "cross";
    return alongI ? "road2" : "road";
  }
  function drawFloat(name, x, y, w) {
    var im = IMG[name], sp = SP[name];
    if (!im || !im.complete) return;
    var h = sp.h * w / sp.w;
    ctx.drawImage(im, x - w / 2, y - h, w, h);
  }
  function diamond(i, j, fill, stroke) {
    var c = cellTop(i, j);
    ctx.beginPath();
    ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + geo.tw / 2, c.y + geo.th / 2);
    ctx.lineTo(c.x, c.y + geo.th); ctx.lineTo(c.x - geo.tw / 2, c.y + geo.th / 2); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  // 문제 그림을 놓을 자리(같은 달 동안 같은 자리)
  function spotsOf(types) {
    var out = [];
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if (types.indexOf(S.grid[i][j]) >= 0) out.push([i, j]);
    return out;
  }
  function pickSome(list, n, seed) {
    var a = list.slice(), r = seed;
    var res = [];
    while (a.length && res.length < n) { r = (r * 9301 + 49297) % 233280; res.push(a.splice(r % a.length, 1)[0]); }
    return res;
  }

  function draw() {
    var r = cv.getBoundingClientRect();
    ctx.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    // 바닥 잔디
    for (var s = 0; s <= 2 * (N - 1); s++) for (var i = 0; i < N; i++) {
      var j = s - i; if (j < 0 || j >= N) continue;
      if (!S.grid[i][j]) drawSprite("grass", i, j, 1.02);
    }
    var ts = tutStep();
    if (ts && ts.cell) {
      var al = 0.45 + Math.sin(anim / 8) * 0.25;
      diamond(ts.cell[0], ts.cell[1], "rgba(242,182,50," + al.toFixed(2) + ")", "#d99a10");
    }
    if (hover && !S.over) diamond(hover[0], hover[1], "rgba(255,255,255,.35)", canBuild(hover[0], hover[1]) ? "#1f6f5c" : "#c2512a");
    var sev = S.sev || {};
    var seed = S.month * 7 + 3;
    var jamAt = sev.traffic > 30 ? pickSome(spotsOf(["road"]), Math.ceil(sev.traffic / 34), seed) : [];
    var trashAt = sev.trash > 30 ? pickSome(spotsOf(["house", "apt", "shop"]), Math.ceil(sev.trash / 34), seed + 1) : [];
    var key = function (p) { return p[0] + "," + p[1]; };
    var jamSet = {}, trashSet = {};
    jamAt.forEach(function (p) { jamSet[key(p)] = 1; });
    trashAt.forEach(function (p) { trashSet[key(p)] = 1; });
    // 건물(뒤에서 앞으로)
    for (s = 0; s <= 2 * (N - 1); s++) for (i = 0; i < N; i++) {
      j = s - i; if (j < 0 || j >= N) continue;
      var b = S.grid[i][j];
      if (!b) continue;
      drawSprite(b === "road" ? roadSprite(i, j) : B[b].sprite, i, j, 1.02);
      var c = cellTop(i, j);
      if (jamSet[key([i, j])]) drawFloat("jam", c.x, c.y + geo.th * 0.95, geo.tw * 0.62);
      if (trashSet[key([i, j])]) drawFloat("trash", c.x + geo.tw * 0.2, c.y + geo.th * 1.08, geo.tw * 0.62);
      if (b === "factory" && sev.air > 25) {
        var bob = Math.sin(anim / 30 + i) * 3;
        var fh = SP.factory.h * geo.tw / SP.factory.w;
        var chimney = c.y + geo.th + geo.tw * 0.046 - fh * 0.9;
        drawFloat("smoke", c.x - geo.tw * 0.08, chimney + bob, geo.tw * (0.5 + sev.air / 300));
      }
    }
    // 시민 표정(문제가 크면 화난 시민, 만족도가 높으면 웃는 시민)
    var homes = spotsOf(["house", "apt"]);
    var face = S.tutVoice ? "angry" : S.happy < 50 ? "angry" : S.happy >= 72 ? "happy" : null;
    if (face) pickSome(homes, Math.min(3, homes.length), seed + 5).forEach(function (p, n) {
      var c = cellTop(p[0], p[1]);
      var jump = face === "happy" ? Math.abs(Math.sin(anim / 18 + n)) * 5 : Math.sin(anim / 6 + n) * 1.5;

    });
  }

  var lastT = 0, lastDraw = 0;
  function loop(now) {
    now = now || 0;
    var dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
    lastT = now;
    anim += dt * 60;
    if (S.started && !S.paused && !S.over && S.tut < 0) {
      S.t += dt * (S.fast ? 2 : 1);
      if (S.t >= MONTH_SEC) { S.t = 0; monthTick(); drawSide(); }
    }
    // 그리기는 1초에 30번까지만(블록 칸 안에서 느려지지 않게)
    if (now - lastDraw >= 32) { lastDraw = now; draw(); drawTop(); }
    requestAnimationFrame(loop);
  }

  // ---------- 짓기 ----------
  function pickCell(ev) {
    var r = cv.getBoundingClientRect();
    if (Math.abs(r.width - (geo.w || 0)) > 1 || Math.abs(r.height - (geo.h || 0)) > 1) resize();
    var x = ev.clientX - r.left - geo.ox, y = ev.clientY - r.top - geo.oy;
    var a = x / (geo.tw / 2), b = y / (geo.th / 2);
    var i = Math.floor((a + b) / 2), j = Math.floor((b - a) / 2);
    return i >= 0 && j >= 0 && i < N && j < N ? [i, j] : null;
  }
  function canBuild(i, j) {
    if (S.sel === "bulldoze") return !!S.grid[i][j];
    return !S.grid[i][j] && S.money >= B[S.sel].cost;
  }
  cv.addEventListener("mousemove", function (e) { hover = pickCell(e); });
  cv.addEventListener("mouseleave", function () { hover = null; });
  cv.addEventListener("click", function (e) {
    if (!S.started || S.over) return;
    var c = pickCell(e);
    if (!c) return;
    var i = c[0], j = c[1], cur = S.grid[i][j];
    var ts = tutStep();
    if (ts) {
      if (!ts.cell) return toast(ts.tool ? "아래에서 반짝이는 카드를 먼저 골라 보세요" : "위 안내를 읽어 보세요");
      if (i !== ts.cell[0] || j !== ts.cell[1]) return toast("반짝이는 칸을 눌러 보세요");
      if (S.sel !== ts.need) return toast("아래에서 " + B[ts.need].name + " 카드를 골라 보세요");
    }
    if (S.sel === "bulldoze") {
      if (!cur) return toast("허물 것이 없어요");
      S.money += Math.round(B[cur].cost / 2); S.grid[i][j] = null;
    } else {
      if (cur) return toast("이미 " + B[cur].name + "이(가) 있어요");
      var b = B[S.sel];
      if (S.money < b.cost) return toast("예산이 모자라요 (" + b.cost + "원 필요)");
      S.money -= b.cost; S.grid[i][j] = S.sel; S.built++;
      // 문제가 있을 때 그 문제에 도움 되는 시설을 지으면 기록
      Object.keys(S.sev || {}).forEach(function (k) {
        if ((S.sev[k] || 0) >= 35 && P[k].fix.indexOf(b.name) >= 0) { S.fixedBy[k] = S.fixedBy[k] || {}; S.fixedBy[k][b.name] = 1; }
      });
    }
    S.sev = problems();
    drawSide(); drawTools();
    tutEvent("build", S.grid[i][j]);
  });

  // ---------- 화면 ----------
  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 1400); }

  function drawTop() {
    var m = document.getElementById("money");
    m.textContent = S.money.toLocaleString("ko-KR") + "원"; m.className = "v" + (S.money < 0 ? " neg" : "");
    document.getElementById("pop").textContent = S.pop;
    document.getElementById("popBar").style.width = Math.min(100, S.pop / 5) + "%";
    document.getElementById("popBox").classList.toggle("ok", S.pop >= 500);
    document.getElementById("hnum").textContent = S.happy;
    var hb = document.getElementById("hbar");
    hb.style.width = S.happy + "%";
    hb.style.background = S.happy >= 70 ? "" : S.happy < 40 ? "#c2512a" : "#e0a530";
    document.getElementById("hapBox").classList.toggle("ok", S.happy >= 70);
    drawLeft();
  }
  function drawLeft() {
    var left = S.over ? 0 : Math.max(0, MONTHS - Math.min(S.month, MONTHS) + 1);
    document.getElementById("left").textContent = left;
    document.getElementById("timeBar").style.width = ((MONTHS - left) / MONTHS * 100) + "%";
  }

  function drawSide() {
    var sev = S.sev || {};
    var list = Object.keys(sev).filter(function (k) { return sev[k] >= 20; }).sort(function (a, b) { return sev[b] - sev[a]; }).slice(0, 4);
    if (S.tutVoice) { list = [S.tutVoice]; sev = Object.assign({}, sev); sev[S.tutVoice] = Math.max(sev[S.tutVoice] || 0, 55); }
    var h = '<p class="h2">시민 목소리</p>';
    if (!list.length) {
      h += '<div class="voice"><img src="' + SP.happy.src + '" alt=""><p>우리 동네가 살기 좋아요!<small>지금은 큰 문제가 없어요. 인구를 더 늘려 볼까요?</small></p></div>';
    } else list.forEach(function (k) {
      var p = P[k];
      h += '<div class="voice"><img src="' + SP.angry.src + '" alt=""><p>"' + p.say + '"<span class="tag">' + p.name + '</span>' +
        '<span class="meter"><i style="width:' + Math.round(sev[k]) + '%"></i></span>' +
        '<small>도움이 되는 시설: ' + p.fix + '</small></p></div>';
    });
    var b = B[S.sel];
    h += '<div class="info"><b>' + b.name + '</b>' + (b.cost ? " · " + b.cost + "원" : "") + (b.upkeep ? " · 달마다 " + b.upkeep + "원" : "") + '<br>' + b.info + '</div>';
    var t = totals();
    var capH = t.homes, capJ = Math.round(t.jobs * 1.3 + 30), lim = capH <= capJ ? "집" : "일자리";
    h += '<div class="info"><b>인구는 어디까지 늘까?</b><br>집으로 <b>' + capH + '</b>명 · 일자리로 <b>' + capJ + '</b>명<br>지금은 <b style="color:var(--warn)">' + lim + '</b> 때문에 ' + Math.min(capH, capJ) + '명까지만 늘어요.' +
      '<br>달마다 들어오는 돈 약 <b>' + Math.round(S.pop * 0.9 + t.tax - t.upkeep) + '</b>원</div>';
    document.getElementById("side").innerHTML = h;
  }

  var toolsEl = document.getElementById("tools");
  function drawTools() {
    var h = "";
    ORDER.forEach(function (k) {
      var b = B[k];
      var poor = k !== "bulldoze" && S.money < b.cost;
      var tsx = tutStep();
      h += '<button class="tool' + (S.sel === k ? " on" : "") + (tsx && tsx.tool === k && S.sel !== k ? " pulse" : "") + (poor ? " poor" : "") + '" data-k="' + k + '">' +
        '<img src="' + SP[b.sprite].src + '" alt=""><span>' + b.name + '</span><em>' + (b.cost ? b.cost + "원" : "돌려받기") + '</em></button>';
    });
    toolsEl.innerHTML = h;

      el.addEventListener("click", function () { S.sel = el.getAttribute("data-k"); drawTools(); drawSide(); tutEvent("select", S.sel); });
    });
  }

  (function () {
    var fb = document.getElementById("fullBtn"), de = document.documentElement;
    var can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!can) return;
    fb.hidden = false;
    fb.addEventListener("click", function () {
      var on = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      } catch (e) {}
    });
    function sync() {
      var on = document.fullscreenElement || document.webkitFullscreenElement;
      fb.textContent = on ? "작게 보기" : "크게 보기"; fb.classList.toggle("on", !!on);
    }
    document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync);
  })();
  document.getElementById("pause").addEventListener("click", function () {
    S.paused = !S.paused; this.textContent = S.paused ? "계속" : "멈춤"; this.classList.toggle("on", S.paused);
  });
  document.getElementById("fast").addEventListener("click", function () {
    S.fast = !S.fast; this.classList.toggle("on", S.fast);
  });
  document.querySelectorAll("[data-sp]").forEach(function (el) { el.src = SP[el.getAttribute("data-sp")].src; });
  document.getElementById("startBtn").addEventListener("click", function () {
    document.getElementById("intro").classList.remove("show"); S.started = true; startTut();
  });

  // ---------- 끝 ----------
  function end() {
    S.over = true; S.month = MONTHS;
    var win = S.pop >= 500 && S.happy >= 70;
    var H = S.hist;
    function avg(k) { return Math.round(H.reduce(function (a, x) { return a + x[k]; }, 0) / H.length); }
    var peak = { pop: 0, m: 1 }, low = { heron: 99, m: 1 };
    H.forEach(function (x, n) { if (x.pop > peak.pop) peak = { pop: x.pop, m: Math.max(1, n) }; if (x.heron !== undefined && x.heron < low.heron) low = { heron: x.heron, m: Math.max(1, n) }; });
    // 지은 시설(처음부터 있던 것 포함, 도로 빼고)
    var cnt = {}, builtN = 0;
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
      var g = S.grid[i][j];
      if (!g || ["road", "river", "stumps"].indexOf(g) >= 0 || !B[g]) continue;
      cnt[g] = (cnt[g] || 0) + 1; builtN++;
    }
    var builtTxt = ORDER.filter(function (k) { return cnt[k]; }).map(function (k) { return B[k].name + " <b>" + cnt[k] + "</b>"; }).join(" · ") || "없음";
    function tile(label, v, unit, ok) {
      var goal = ok !== undefined;
      return '<div class="tile' + (ok ? " ok" : "") + '"><small>' + label + '</small><b>' + v + ' <em>' + unit + '</em></b>' +
        (goal ? '<span class="res">' + (ok ? "목표 이룸" : "목표 못 이룸") + '</span>' : '') + '</div>';
    }
    var keys = Object.keys(P).filter(function (k) { return S.seen[k]; }).sort(function (a, b) { return S.seen[b] - S.seen[a]; });
    var bars = keys.map(function (k) {
      var fixed = S.fixedBy[k] ? Object.keys(S.fixedBy[k]).join(", ") : "지은 시설 없음";
      return '<div class="pb"><span>' + P[k].name + '</span><span class="t"><i style="width:' + Math.round(S.seen[k] / MONTHS * 100) + '%"></i></span><b>' + S.seen[k] + '달</b>' +
        '<small>처음 ' + S.firstAt[k] + '달째 · ' + fixed + '</small></div>';
    }).join("");
    var line = keys.length ? keys.slice(0, 3).map(function (k) { return P[k].name + " " + S.seen[k] + "달"; }).join(", ") : "큰 문제 없이 도시를 키웠어요.";
    var h = "<h2>" + (win ? "살기 좋은 도시를 만들었어요!" : "36달이 지났어요") + "</h2>" +
      '<div class="endgrid"><div><div class="tiles">' + tile("인구", S.pop, "/ 500명", S.pop >= 500) + tile("만족도", S.happy, "/ 70", S.happy >= 70) +
      tile("가장 많았던 인구", peak.pop, "명 · " + peak.m + "달째") + tile("평균 만족도", avg("happy"), "") +
      tile("지은 시설", builtN, "개") + tile("남은 예산", S.money.toLocaleString("ko-KR"), "원") + '</div>' +
      '<p class="sec">지은 시설</p><div class="built">' + builtTxt + '</div></div>' +
      '<div><canvas class="chart" id="chart"></canvas>' + '<p style="font-size:12px;color:#5b6873;margin:2px 0 0">초록 선: 인구 · 주황 선: 만족도</p>' +
      '<p class="sec">도시 문제를 겪은 기간 (36달 중)</p>' + (bars || "<p>큰 문제 없이 도시를 키웠어요.</p>") +
      '</div></div>' +
      '<div class="row"><button class="btn" id="againBtn">다시 하기</button>' + (window.Block ? '<button class="btn send" id="sendBtn">보내기</button>' : '') + '</div>';
    document.getElementById("endCard").innerHTML = h;
    document.getElementById("endCard").classList.add("wide");
    document.getElementById("endCover").classList.add("show");
    drawChart();
    document.getElementById("againBtn").addEventListener("click", function () {
      S = fresh(); S.started = true; S.sev = problems();
      document.getElementById("endCover").classList.remove("show"); drawSide(); drawTools();
    });
    var sendBtn = document.getElementById("sendBtn");
    if (sendBtn) sendBtn.addEventListener("click", function () {
      if (!(window.Block && Block.send)) return;
      try { Block.send({ values: [
        { label: "인구", value: S.pop, unit: "명" }, { label: "만족도", value: S.happy, unit: "점" },
        { label: "가장 많았던 인구", value: peak.pop, unit: "명" }, { label: "평균 만족도", value: avg("happy"), unit: "점" },
        { label: "지은 시설", value: builtN, unit: "개" }, { label: "겪은 문제", value: Object.keys(S.seen).length, unit: "가지" }
      ], text: line.slice(0, 200) }); sendBtn.disabled = true; sendBtn.textContent = "보냈어요"; } catch (e) {}
    });
  }
  function drawChart() {
    var c = document.getElementById("chart"), r = c.getBoundingClientRect();
    c.width = r.width * 2; c.height = r.height * 2;
    var g = c.getContext("2d"); g.scale(2, 2);
    var H = S.hist, w = r.width, h = r.height, maxPop = Math.max(500, Math.max.apply(null, H.map(function (x) { return x.pop; })));
    g.strokeStyle = "#d5dde3"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, h - 1); g.lineTo(w, h - 1); g.stroke();
    function line(get, max, color) {
      g.strokeStyle = color; g.lineWidth = 2.5; g.beginPath();
      H.forEach(function (p, n) { var x = n / Math.max(1, H.length - 1) * (w - 4) + 2, y = h - 4 - get(p) / max * (h - 10); n ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    }
    line(function (p) { return p.pop; }, maxPop, "#1f6f5c");
    line(function (p) { return p.happy; }, 100, "#e0902a");
  }

  // ---------- 따라 하기 ----------
  var FIXKEY = { traffic: "bus", parking: "parking", trash: "recycle", air: "park", housing: "apt", jobs: "shop", play: "park", school: "school", hospital: "hospital" };
  var TUT = [];
  function freeNear(pref) {
    for (var n = 0; n < pref.length; n++) if (!S.grid[pref[n][0]][pref[n][1]]) return pref[n];
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if (!S.grid[i][j]) return [i, j];
  }
  function buildTut() {
    TUT = [
      { text: "사람들이 일할 곳부터 만들어요. 아래에서 반짝이는 상가 카드를 눌러 보세요.", tool: "shop", face: "happy" },
      { text: "좋아요! 이제 땅 위에 반짝이는 칸을 눌러 상가를 지어요.", cell: freeNear([[5, 3], [5, 4]]), need: "shop", face: "happy" },
      { text: "일자리가 생겼어요. 이번엔 사람들이 살 아파트 카드를 눌러 보세요.", tool: "apt", face: "happy" },
      { text: "반짝이는 칸을 눌러 아파트를 지어요.", cell: freeNear([[2, 3], [2, 4]]), need: "apt", face: "happy" },
      { text: "시간이 흐르면 사람들이 이사 와요. 잠깐 지켜보세요.", wait: true, face: "happy" }
    ];
  }
  function tutStep() { return S && S.tut >= 0 ? TUT[S.tut] : null; }
  function showTut() {
    var t = tutStep(), el = document.getElementById("tut");
    if (!t) { el.classList.remove("show"); drawTools(); return; }
    el.classList.add("show");
    document.getElementById("tutImg").src = SP[t.face || "happy"].src;
    document.getElementById("tutStep").textContent = "따라 하기 " + (S.tut + 1) + "/8";
    document.getElementById("tutText").textContent = t.text;
    document.getElementById("tutSkip").textContent = t.done ? "혼자 하기" : "건너뛰기";
    drawTools();
  }
  function startTut() { buildTut(); S.tut = 0; showTut(); }
  function endTut() {
    S.tut = -1; S.tutVoice = null; S.month = 1; S.t = 0; S.hist = [{ pop: S.pop, happy: S.happy }]; S.seen = {}; S.firstAt = {}; S.fixedBy = {};
    showTut(); drawSide();
    toast("이제 혼자 해 보세요! 36달 안에 인구 500명, 만족도 70");
  }
  function nextTut() {
    S.tut++;
    var t = tutStep();
    if (!t) return endTut();
    showTut();
    if (t.wait) {
      var n = 0;
      (function run() {
        if (S.tut < 0) return;
        monthTick(); S.month = 1; drawSide(); n++;
        document.getElementById("tutText").textContent = "사람들이 이사 오고 있어요… 인구 " + S.pop + "명";
        if (n < 4) return setTimeout(run, 700);
        var sev = problems(), top = Object.keys(sev).sort(function (a, b) { return sev[b] - sev[a]; })[0];
        if (!sev[top]) top = "play";
        var fix = FIXKEY[top], p = P[top];
        S.tutVoice = top; drawSide();
        TUT.push({ text: "시민이 말해요: \"" + p.say + "\" (" + p.name + ") 반짝이는 " + B[fix].name + " 카드를 눌러 보세요.", tool: fix, face: "angry" });
        TUT.push({ text: "반짝이는 칸을 눌러 " + B[fix].name + "을(를) 지어요.", cell: freeNear([[6, 3], [6, 4], [3, 4]]), need: fix, face: "angry" });
        TUT.push({ text: "잘했어요! 시민 목소리를 듣고 알맞은 시설을 지으면 만족도가 올라가요. 이제 혼자 도시를 키워 보세요!", done: true, face: "happy" });
        nextTut();
      })();
    }
  }
  function tutEvent(kind, key) {
    var t = tutStep();
    if (!t) return;
    if (kind === "select" && t.tool && key === t.tool) nextTut();
    else if (kind === "build" && t.cell && key === t.need) { if (S.tutVoice) { S.tutVoice = null; drawSide(); } nextTut(); }
  }
  document.getElementById("tutSkip").addEventListener("click", endTut);

  window.__city = { cell: function (i, j) { var c = cellTop(i, j), r = cv.getBoundingClientRect(); return [r.left + c.x, r.top + c.y + geo.th / 2]; }, step: function () { return S.tut; }, state: function () { return S; }, tick: monthTick, problems: problems, fresh: function () { S = fresh(); S.sev = problems(); return S; } };

  S = fresh(); S.sev = problems();
  window.addEventListener("resize", function () { resize(); });
  // 글꼴·안내 칸·세로 화면 때문에 게임판 칸 크기가 바뀌어도 그림과 누르는 자리를 다시 맞춰요
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(cv);
  cv.style.touchAction = "manipulation";
  resize(); drawSide(); drawTools(); loop();
})();
</script>
</body>
</html>
